schemaVersion: "2"
kind: sandbox
name: pi-bolt
displayName: Pi-Bolt
description: Pi coding agent compiled ahead of time for fast, low-overhead Linux x86-64 sessions
licenses:
  - MIT

sandbox:
  image: docker/sandbox-templates:shell
  entrypoint:
    - /home/agent/.local/bin/pi-bolt

agentInstructions:
  filename: AGENTS.md

permissions:
  network:
    allow:
      # Official installer.
      - pi-bolt.opensec.in:443
      # Release resolution, signed checksums, and the installer's fallback
      # binary source.
      - github.com:443
      - release-assets.githubusercontent.com:443
      # Primary binary source plus Pi packages and extensions at runtime.
      - registry.npmjs.org:443
      # Anthropic inference and Claude subscription-token refresh.
      - api.anthropic.com:443
      - platform.claude.com:443

credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
    oauth:
      tokenEndpoint:
        host: platform.claude.com
        path: /v1/oauth/token
      resourceHosts:
        - api.anthropic.com
      sentinels:
        accessToken: sk-ant-oat01-proxy-managed
        refreshToken: sk-ant-ort01-proxy-managed
      credentialFile:
        path: ~/.pi/agent/auth.json
        structure:
          anthropic:
            type: oauth
            access: "{{.AccessToken}}"
            refresh: "{{.RefreshToken}}"
            expires: "{{.ExpiresAt}}"

setup:
  install:
    - command: |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64) ;;
          *) echo "Pi-Bolt supports Linux x86-64 only; this sandbox is $(uname -m)." >&2; exit 1 ;;
        esac
        openssl version | grep -Eq '^OpenSSL 3\.'
        mkdir -p "$HOME/.local/bin"
        installer=$(mktemp)
        trap 'rm -f "$installer"' EXIT
        curl --proto '=https' --tlsv1.2 -fsSL https://pi-bolt.opensec.in/install.sh -o "$installer"
        PIBOLT_YES=1 \
          PIBOLT_EXTENSIONS=no \
          PIBOLT_INSTALL="$HOME/.pi-bolt" \
          PIBOLT_BIN_DIR="$HOME/.local/bin" \
          sh "$installer"
        "$HOME/.local/bin/pi-bolt" --version
      user: "1000"
      description: Install the latest signed Pi-Bolt release
    - command: 'if command -v npm >/dev/null 2>&1 && [ -n "${HTTP_PROXY:-}" ]; then npm config set proxy="$HTTP_PROXY" https-proxy="${HTTPS_PROXY:-$HTTP_PROXY}"; fi'
      user: "1000"
      description: Point npm at the sandbox proxy for Pi packages and extensions
